<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <article>
    <div class="nft-div">
      <img class="nft-img" src="./images/image-equilibrium.jpg" alt="imagen ilistrativa de NFT">
      <div class="eye-background"></div>
      <div class="eye-icon">
        <img src="./images/icon-view.svg" alt="eye icon">
      </div>
    </div>
    <h2>Equilibrium #3429</h2>
    <p class="description">
      Our Equilibrium collection promotes balance and calm.
    </p>

    <div class="data-nft">
      <div class="price">
        <img src="./images/icon-ethereum.svg" alt="icono de ethereum">
        <strong>0.041ETH</strong>
      </div>
      <div class="time">
        <img src="./images/icon-clock.svg" alt="icono de reloj">
        <span>
          3 days left
        </span>
      </div>
    </div>

    <hr>

    <div class="avatar">
      <img src="./images/image-avatar.png" alt="Imagen de usuario">
      <p>Creation of <strong>Jules Wyvern</strong></p>
    </div>

  </article>

  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>

</html>
