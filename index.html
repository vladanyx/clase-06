<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 

  

  0.041 ETH
  3 days left

  Creation of Jules Wyvern -->

  <article>
    <div>
      <img src="./images/image-equilibrium.jpg" alt="imagen ilistrativa de NFT">
    </div>
    <h2>Equilibrium #3429</h2>
    <p>
      Our Equilibrium collection promotes balance and calm.
    </p>
    <div>
      <div>
        <img src="./images/icon-ethereum.svg" alt="icono de ethereum">
        <strong>0.041ETH</strong>
      </div>
      <div>
        <img src="./images/icon-clock.svg" alt="icono de reloj">
        <span>
          3 days left
        </span>
      </div>
    </div>
    <hr>
    <div>
      <img src="./images/image-avatar.png" alt="Imagen de usuario">
      <p>Creation of <strong>Jules Wyvern</strong></p>
    </div>
  </article>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.

</html>
